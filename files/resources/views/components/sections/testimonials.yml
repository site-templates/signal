# The visual editor's contract for sections/testimonials.blade.php. The
# quotes live in resources/data/collections/testimonials.json.
title: Testimonials
description: Heading plus three quote cards from the testimonials collection
fields:
    eyebrow:
        type: text
        label: Eyebrow
        default: "Loved by product teams"
    heading:
        type: text
        label: Heading
        default: "The changelog stopped being a chore"
    items:
        type: repeater
        label: Testimonials
        add_button_label: "Add testimonial"
        item_label: name
        source: testimonials
        sub_fields:
            quote:
                type: textarea
                label: Quote
                rows: 4
                default: ""
            name:
                type: text
                label: Name
                default: "New person"
            role:
                type: text
                label: Role
                default: ""
            avatar:
                type: image
                label: Photo
                default: "https://assets.ui.sh/avatars/2.webp?size=160"
