# The visual editor's contract for sections/blog-grid.blade.php. The cards
# live in resources/data/collections/posts.json; each links to a page under
# resources/views/pages/blog/.
title: Blog grid
description: Two-column post cards from the posts collection
fields:
    items:
        type: repeater
        label: Posts
        add_button_label: "Add post"
        item_label: title
        source: posts
        sub_fields:
            title:
                type: text
                label: Title
                default: "New post"
            description:
                type: textarea
                label: Excerpt
                rows: 2
                default: ""
            date:
                type: text
                label: Date
                default: "Jan 1, 2026"
            readTime:
                type: text
                label: Read time
                default: "4 min"
            author:
                type: text
                label: Author
                default: "Signal Team"
            authorImage:
                type: image
                label: Author photo
                default: "https://assets.ui.sh/avatars/2.webp?size=160"
            image:
                type: image
                label: Cover image
                default: "https://assets.ui.sh/wallpapers/silk.webp?variant=molten-amber"
            imageAlt:
                type: text
                label: Cover alt text
                default: ""
            link:
                type: url
                label: Link
                default: "/blog"

            category:
                type: text
                label: "Category"
            content:
                type: richtext
                label: "Post body"
            descriptionDetail:
                type: textarea
                label: "Detail-page intro"
            readTimeDetail:
                type: text
                label: "Detail read time"
            slug:
                type: text
                label: "Slug"